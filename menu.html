<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBites | Menu & Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-utensils text-orange-500 text-2xl"></i>
                <span class="text-xl font-bold tracking-tight text-gray-900">Fresh<span class="text-orange-500">Bites</span></span>
            </div>
            <nav class="hidden md:flex space-x-6 font-semibold">
                <a href="index.html" class="text-gray-600 hover:text-orange-500">Home</a>
                <a href="menu.html" class="text-orange-500">Menu & Cart</a>
                <a href="about.html" class="text-gray-600 hover:text-orange-500">About Us</a>
                <a href="contact.html" class="text-gray-600 hover:text-orange-500">Contact</a>
            </nav>
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative bg-orange-500 text-white px-4 py-2 rounded-full font-medium flex items-center space-x-2 hover:bg-orange-600 transition shadow">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart</span>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-600 text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Menu Content -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Our Delicious Menu</h2>
        <p class="text-center text-gray-600 mb-10">Select your meals and open your cart to checkout via WhatsApp (+267 7337697).</p>
        
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Items injected via JavaScript -->
        </div>
    </main>

    <!-- Slide-out Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-end z-50">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 bg-orange-500 text-white flex justify-between items-center">
                <h3 class="text-lg font-bold flex items-center"><i class="fa-solid fa-cart-shopping mr-2"></i> Your Order Cart</h3>
                <button onclick="toggleCart()" class="text-white hover:text-gray-200 text-2xl font-bold px-2">&times;</button>
            </div>
            
            <!-- Cart items list starts empty -->
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
                <p class="text-gray-500 text-center py-8">Your cart is currently empty.</p>
            </div>

            <div class="p-4 bg-gray-100 border-t border-gray-200">
                <div class="flex justify-between mb-4 text-lg font-bold">
                    <span>Total:</span>
                    <span id="cart-total" class="text-orange-600">P0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition flex items-center justify-center space-x-2 shadow">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Checkout via WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 text-center mt-12">
        <p class="mb-2 font-semibold">FreshBites Restaurant</p>
        <p class="text-gray-400 text-sm mb-2">Hotline: <span class="text-orange-400 font-bold">+267 7337697</span></p>
        <p class="text-gray-500 text-xs">&copy; 2026 FreshBites. All rights reserved.</p>
    </footer>

    <!-- Scripting for Menu and Cart -->
    <script>
        const menuItems = [
            { id: 1, name: "Classic Cheeseburger", category: "Fast Food", price: 65.00, image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80", description: "Juicy beef patty with melted cheddar, lettuce, tomatoes, and house sauce." },
            { id: 2, name: "Pepperoni Pizza Feast", category: "Pizza", price: 120.00, image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=600&q=80", description: "Loaded with double pepperoni, mozzarella cheese, and rich tomato baseline." },
            { id: 3, name: "Crispy Fried Chicken", category: "Chicken", price: 85.00, image: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&w=600&q=80", description: "Golden brown, ultra-crispy fried chicken pieces served with spicy dip." },
            { id: 4, name: "Avocado & Salmon Salad", category: "Healthy", price: 95.00, image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=600&q=80", description: "Fresh greens topped with sliced avocado, grilled salmon, and vinaigrette." },
            { id: 5, name: "Creamy Alfredo Pasta", category: "Pasta", price: 110.00, image: "https://images.unsplash.com/photo-1645112411341-6c4fd0237146?auto=format&fit=crop&w=600&q=80", description: "Fettuccine pasta tossed in a rich, creamy garlic parmesan sauce." },
            { id: 6, name: "Chocolate Lava Cake", category: "Dessert", price: 50.00, image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=600&q=80", description: "Warm chocolate cake with a gooey, melting molten center." }
        ];

        let cart = [];

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = menuItems.map(item => `
                <div class="bg-white rounded-2xl shadow-md overflow-hidden flex flex-col hover:shadow-xl transition duration-300">
                    <div class="h-48 overflow-hidden relative">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                        <span class="absolute top-3 right-3 bg-orange-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow">${item.category}</span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 mb-1">${item.name}</h3>
                            <p class="text-gray-600 text-sm mb-4">${item.description}</p>
                        </div>
                        <div class="flex items-center justify-between mt-4">
                            <span class="text-xl font-extrabold text-orange-600">P${item.price.toFixed(2)}</span>
                            <button onclick="addToCart(${item.id})" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-orange-500 transition shadow">
                                <i class="fa-solid fa-plus mr-1"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('hidden');
            drawer.classList.toggle('flex');
        }

        function addToCart(id) {
            const product = menuItems.find(item => item.id === id);
            const cartItem = cart.find(item => item.id === id);
            
            if (cartItem) { 
                cartItem.quantity += 1; 
            } else { 
                cart.push({ ...product, quantity: 1 }); 
            }
            
            updateCartUI();
            toggleCart(); 
        }

        function changeQuantity(id, change) {
            const cartItem = cart.find(item => item.id === id);
            if (cartItem) {
                cartItem.quantity += change;
                if (cartItem.quantity <= 0) { 
                    cart = cart.filter(item => item.id !== id); 
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cart-count');
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalCount;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-gray-500 text-center py-8">Your cart is currently empty.</p>`;
                cartTotal.textContent = "P0.00";
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-200 shadow-sm">
                    <div class="flex items-center space-x-3">
                        <img src="${item.image}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                            <p class="text-xs text-orange-600 font-semibold">P${item.price.toFixed(2)} each</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQuantity(${item.id}, -1)" class="w-7 h-7 bg-gray-200 rounded-full font-bold text-gray-700 hover:bg-gray-300 flex items-center justify-center">-</button>
                        <span class="text-sm font-bold w-4 text-center">${item.quantity}</span>
                        <button onclick="changeQuantity(${item.id}, 1)" class="w-7 h-7 bg-gray-200 rounded-full font-bold text-gray-700 hover:bg-gray-300 flex items-center justify-center">+</button>
                    </div>
                </div>
            `).join('');

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.textContent = `P${totalPrice.toFixed(2)}`;
        }

        function checkout() {
            if (cart.length === 0) { 
                alert("Your cart is empty! Please add some food items first."); 
                return; 
            }
            let message = "Hello FreshBites! I would like to place an order:%0A%0A";
            let totalPrice = 0;
            cart.forEach(item => {
                let itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;
                message += `- ${item.name} (x${item.quantity}): P${itemTotal.toFixed(2)}%0A`;
            });
            message += `%0A*Total Amount: P${totalPrice.toFixed(2)}*%0A`;
            window.open(`https://wa.me/2677337697?text=${message}`, '_blank');
        }

        updateCartUI();
        renderMenu();
    </script>
</body>
</html>
